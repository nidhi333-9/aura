name: CI

# Runs on every push to main and on every pull request, so a change that breaks the tests, the
# website's lint/build or the sensor is noticed before it goes live (Vercel and Render deploy
# from main). It only reads the code: it needs no secrets and never touches the real database.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels the older run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The backend has no lockfile (Render installs the same way), so this is a plain install.
      - run: npm install --no-audit --no-fund
      # No database needed: the tests use stand-ins for it.
      - run: npm test

  website:
    name: Website lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  sensor:
    name: Sensor tests (macOS)
    # macOS because the sensor's window library only starts on a real desktop OS, and the sensor is
    # built on macOS too. (macos-14 is being retired by GitHub, ending 2 Nov 2026.)
    runs-on: macos-15
    defaults:
      run:
        working-directory: tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pywinctl requests
      - run: python -m unittest test_sensor -v

  deploy:
    name: Deploy the backend to Render (only after the backend tests pass)
    needs: backend
    # Only for a push to main, never for a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Render's private "deploy hook" URL, stored as a GitHub secret (README: "Deploying"). It lets this
      # workflow, and nothing else, start a deploy. It is never printed.
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Say so when deploying is not set up
        if: env.RENDER_DEPLOY_HOOK == ''
        run: echo "::warning::The secret RENDER_DEPLOY_HOOK is not set, so nothing was deployed. See README, 'Deploying'."
      - uses: actions/checkout@v4
        if: env.RENDER_DEPLOY_HOOK != ''
      - uses: actions/setup-node@v4
        if: env.RENDER_DEPLOY_HOOK != ''
        with:
          node-version: 22
      - name: Ask Render to deploy exactly this commit
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}" -o /dev/null -w "Render accepted the request (HTTP %{http_code})\n"
      # A deploy that never goes live must not look like success: wait until the live backend says it runs
      # this commit (GET /api/version). A free instance can take a few minutes to build and start.
      - name: Wait until the live backend runs this commit
        if: env.RENDER_DEPLOY_HOOK != ''
        run: node backend/scripts/check-deploy.js --commit "$GITHUB_SHA" --wait 720 --every 10

  dependency-audit:
    name: Dependency audit (warns, never blocks)
    runs-on: ubuntu-latest
    # A newly published advisory must not turn an unrelated push red. Read this job's log to see it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Website packages
        working-directory: frontend
        run: npm ci --no-fund && npm audit --omit=dev --audit-level=moderate
      - name: Backend packages
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-fund && npm audit --omit=dev --audit-level=moderate
